[project]
name = "rmkr-skills-tooling"
version = "0.1.0"
description = "Validation tooling for a cross-agent skill collection"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "questionary>=2,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
rmkr-triage-render = { path = "skills/triage-investigate", editable = true }

[dependency-groups]
dev = [
    "rmkr-triage-render",
]
