name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7" "questionary>=2,<3" ./skills/triage-investigate

      - name: Validate repository
        run: python scripts/validate.py

      - name: Run tooling tests
        run: python -m unittest discover -s tests -v
